<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>CRA Admin</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>

<section id="login-view">
  <form id="login-form">
    <h1>🔴 CRA Admin</h1>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
    <p id="login-error" class="err" hidden></p>
  </form>
</section>

<main id="app-view" hidden>
  <header>
    <h1>🔴 CRA Admin</h1>
    <div id="stats-bar"></div>
    <button id="logout">Sign out</button>
  </header>

  <nav id="tabs">
    <button data-tab="users" class="active">Users</button>
    <button data-tab="themes">Themes</button>
    <button data-tab="audit">Audit</button>
  </nav>

  <section id="tab-users" class="tab">
    <div class="toolbar">
      <input id="user-search" type="search" placeholder="Search username…">
      <button id="add-user-btn">+ Add user</button>
      <button id="bulk-btn">Bulk add</button>
    </div>
    <div class="table-wrap">
    <table id="user-table">
      <thead><tr><th>Username</th><th>Access</th><th>Rainbow</th><th>Themes</th><th>Note</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    </div>
    <div class="toolbar">
      <button id="prev-page">Previous</button>
      <span id="page-info"></span>
      <button id="next-page">Next</button>
    </div>
  </section>

  <section id="tab-themes" class="tab" hidden>
    <div class="toolbar">
      <button data-bulk="on">Enable all seasonal</button>
      <button data-bulk="off">Disable all seasonal</button>
    </div>
    <h2>Standard</h2>
    <div id="theme-standard"></div>
    <h2>Seasonal</h2>
    <div id="theme-seasonal"></div>
  </section>

  <section id="tab-audit" class="tab" hidden>
    <p class="hint">Refused writes. This table should stay near-empty; entries mean malformed or forged requests.</p>
    <div class="table-wrap">
    <table id="audit-table">
      <thead><tr><th>When</th><th>User</th><th>Reason</th><th>Detail</th></tr></thead>
      <tbody></tbody>
    </table>
    </div>
  </section>
</main>

<dialog id="user-dialog">
  <form method="dialog" id="user-form">
    <h2 id="user-dialog-title">Add user</h2>
    <label>Username <input id="f-username" required maxlength="32"></label>
    <label><input id="f-authorized" type="checkbox" checked> Authorized</label>
    <label><input id="f-rainbow" type="checkbox"> Rainbow name</label>
    <label><input id="f-themes" type="checkbox"> Theme picker</label>
    <label>Note <input id="f-note" maxlength="500"></label>
    <menu><button type="submit" value="cancel" formnovalidate id="f-cancel">Cancel</button><button type="submit" id="f-save" value="save">Save</button></menu>
  </form>
</dialog>

<dialog id="bulk-dialog">
  <form method="dialog" id="bulk-form">
    <h2>Bulk add</h2>
    <p class="hint">One username per line. Existing users are left untouched.</p>
    <textarea id="f-bulk" rows="12"></textarea>
    <menu><button type="submit" value="cancel" formnovalidate id="f-bulk-cancel">Cancel</button><button type="submit" value="save" id="f-bulk-save">Add all</button></menu>
  </form>
</dialog>

<script src="admin.js"></script>
</body>
</html>
